# MES Receiver Dataflow
# Receives operation events from machine-simulator MES and publishes to UNS
#
# Events received:
#   - operation_started: When an operation begins on a machine
#   - operation_completed: When an operation finishes
#
# Target topic: umh.v1.__ENTERPRISE__.__SITE__._mes.operations

input:
  http_server:
    address: 0.0.0.0:8093
    allowed_verbs:
      - POST
    path: /api/v1/operations
    timeout: 30s

pipeline:
  processors:
    - nodered_js:
        code: |
          // Add UMH topic for routing
          msg.meta = msg.meta || {};
          msg.meta.umh_topic = "umh.v1.__ENTERPRISE__.__SITE__._mes.operations";

          // Ensure timestamp is present
          if (!msg.payload.timestamp) {
            msg.payload.timestamp = new Date().toISOString();
          }
          msg.payload.timestamp_ms = Date.now();

          return msg;

output:
  uns: {}
