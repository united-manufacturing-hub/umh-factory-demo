# Shift API Dataflow
# Exposes GET /api/shift/current for simulator to poll shift schedules
# The simulator (v1.6.0+) polls this endpoint to determine if production should be active

input:
  http_server:
    address: 0.0.0.0:8094
    allowed_verbs:
      - GET
    path: /api/shift/current

pipeline:
  processors:
    - sql_raw:
        driver: postgres
        dsn: postgres://postgres:postgres@pgbouncer:5432/umh?sslmode=disable
        query: |
          SELECT id as shift_id, shift_name, start_time, end_time
          FROM shifts
          WHERE start_time <= NOW() AND end_time > NOW()
          ORDER BY start_time DESC
          LIMIT 1;
    - bloblang: |
        root = if this.length() > 0 {
          {
            "shift_id": this.index(0).shift_id.string(),
            "shift_name": this.index(0).shift_name,
            "start_time": this.index(0).start_time,
            "end_time": this.index(0).end_time,
            "break_start_time": null,
            "break_end_time": null,
            "is_active": true,
            "is_on_break": false
          }
        } else {
          {
            "shift_id": null,
            "shift_name": null,
            "start_time": null,
            "end_time": null,
            "is_active": false,
            "is_on_break": false
          }
        }

output:
  sync_response: {}
