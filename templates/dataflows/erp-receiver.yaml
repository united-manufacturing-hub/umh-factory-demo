# ERP Receiver Dataflow
# Receives production orders from simulator webhook and shifts from ERP via HTTP
# Webhook payload format: {event_type, timestamp, machine_id, line_id, data: {...}}
# Routes by event_type to appropriate UNS topics.

input:
  http_server:
    address: 0.0.0.0:8090
    allowed_verbs:
      - POST
    path: /api/v1/

pipeline:
  processors:
    - nodered_js:
        code: |
          const path = msg.meta.http_server_request_path || '';
          const eventType = msg.payload.event_type || '';
          const data = msg.payload.data || {};
          const lineId = msg.payload.line_id || '';

          if (eventType === 'order.created') {
              // order.created data is the full Order struct: {id, product_id, planned_qty, ...}
              msg.meta.umh_topic = "umh.v1.__ENTERPRISE__.__SITE__._erp.orders";
              msg.payload = {
                  orderId: data.id || data.order_id || '',
                  partNumber: data.product_id || '',
                  quantity: data.planned_qty || 0,
                  status: 'CREATED',
                  target_line: lineId,
                  timestamp_ms: Date.now(),
                  type: "production_order"
              };
          } else if (eventType === 'order.progress') {
              // order.progress data is a map: {order_id, good_qty, scrap_qty, planned_qty, planned_cycle_time_ms}
              msg.meta.umh_topic = "umh.v1.__ENTERPRISE__.__SITE__._erp.orders";
              msg.payload = {
                  orderId: data.order_id || '',
                  quantity: data.planned_qty || 0,
                  quantityCompleted: data.good_qty || 0,
                  quantityScrap: data.scrap_qty || 0,
                  planned_cycle_time_ms: data.planned_cycle_time_ms || null,
                  status: 'IN_PROGRESS',
                  target_line: lineId,
                  timestamp_ms: Date.now(),
                  type: "order_progress"
              };
          } else if (eventType === 'order.closed') {
              // order.closed data is the full Order struct: {id, good_qty, scrap_qty, ...}
              msg.meta.umh_topic = "umh.v1.__ENTERPRISE__.__SITE__._erp.orders";
              msg.payload = {
                  orderId: data.id || data.order_id || '',
                  quantityCompleted: data.good_qty || 0,
                  quantityScrap: data.scrap_qty || 0,
                  status: 'COMPLETED',
                  target_line: lineId,
                  timestamp_ms: Date.now(),
                  type: "production_order"
              };
          } else if (eventType && eventType.startsWith('machine.')) {
              // Machine data flows via OPC-UA, drop these events
              return null;
          } else if (path.includes('shifts')) {
              msg.meta.umh_topic = "umh.v1.__ENTERPRISE__.__SITE__._erp.shifts";
              msg.payload.type = "shift_update";
              msg.payload.timestamp_ms = Date.now();
          } else {
              msg.meta.umh_topic = "umh.v1.__ENTERPRISE__.__SITE__._erp.unknown";
              msg.payload.timestamp_ms = Date.now();
          }

          return msg;

output:
  uns: {}
