# UMH Demo Stack - Additional Services Template
# This file contains services to be merged with your umh-core deployment
# DO NOT include umh service here - it should be in your main docker-compose.yaml
#
# Usage: Run ./init-demo to merge these services into your deployment

services:
  grafana:
    build:
      context: ./grafana
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - 8080:3000
    environment:
      - GF_INSTALL_PLUGINS=volkovlabs-form-panel, marcusolsson-dynamictext-panel
    volumes:
      - ./grafana-data:/var/lib/grafana
      - ./grafana-provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://grafana:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  pgbouncer:
    image: docker.io/edoburu/pgbouncer:v1.24.1-p1
    restart: unless-stopped
    environment:
      - DB_NAME=umh
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=timescaledb
      - AUTH_TYPE=scram-sha-256
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h pgbouncer"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - default
      - timescaledb-network

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      - POSTGRES_DB=umh
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./timescaledb-data:/var/lib/postgresql/data
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h timescaledb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - timescaledb-network

  machine-simulator:
    image: dh2k/machine-simulator-2:v1.0.0
    restart: unless-stopped
    ports:
      - "8081:8081" # Web UI/API
      - "4840-4880:4840-4880" # OPC-UA ports (dynamic range based on machine count)
      - "502:502" # Modbus TCP
    volumes:
      - ./simulator-data:/app/data
      - ./simulator-config:/app/config:ro
    environment:
      - SIMULATOR_OPCUA_HOSTNAME=machine-simulator
      - LOG_LEVEL=${SIMULATOR_LOG_LEVEL:-info}
      # SIMULATOR_PROFILE or SIMULATOR_LINE_* env vars injected by builder
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8081/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./configs/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    depends_on:
      grafana:
        condition: service_healthy

networks:
  default:
  timescaledb-network:
    internal: true
