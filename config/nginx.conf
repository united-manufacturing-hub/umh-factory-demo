events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    ##
    # HTTP server with webhook and SAP endpoints
    ##
    server {
        listen 80 default_server;
        server_name _;

        # Add CORS headers globally for this server
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'POST,GET,PUT,DELETE,HEAD,OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'content-type' always;

        # Handle OPTIONS requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Stop reason API (update stop reason for a machine stop)
        location /api/v1/stop-reason {
            proxy_pass http://umh-core:8091/api/v1/stop-reason;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Stop reasons admin API (CRUD for stop_reasons table)
        location /api/v1/stop-reasons {
            proxy_pass http://umh-core:8092/api/v1/stop-reasons;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Webhook endpoint
        location /webhook/ {
            proxy_pass http://umh-core:8040/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SAP incoming endpoint
        location /sap_in/ {
            proxy_pass http://umh-core:8051/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default location (fallback to 404)
        location / {
            return 404;
        }
    }
}
