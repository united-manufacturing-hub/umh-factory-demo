# Machine Simulator Configuration
# Default configuration for development and testing

simulator:
  time_scale: 1.0           # 1x realtime (use 10.0 or 100.0 for faster simulation)
  random_factor: 0.1        # 10% variance in cycle times and measurements
  tick_rate: "100ms"        # Internal simulation tick rate

erp:
  mode: auto                # auto | manual
  max_backlog: 5            # Maximum pending orders before backpressure
  auto_order_interval_ms: 30000  # New order every 30 seconds in auto mode
  order_progress_interval_ms: 5000  # v1.6.0: Send progress every 5s

mes:
  dispatch_interval_ms: 1000    # Check for pending work every second
  enable_external_shift: true       # v1.6.0: Poll external API for shift status
  external_api_endpoint: ""         # v1.6.0: Set via MES_EXTERNAL_API env var
  shift_poll_interval_ms: 60000     # v1.6.0: Poll every 60s

# v1.6.0: Shift management settings
shift:
  enabled: true
  start_time: "06:00"
  end_time: "22:00"
  timezone: "Local"
  work_days: [1, 2, 3, 4, 5]  # Monday through Friday
  break_start_time: ""
  break_end_time: ""

api:
  host: "0.0.0.0"
  port: 8081
  enable_cors: true

# OPC-UA server performance settings
opcua:
  update_rate_ms: 100        # How often to update node values (ms)
  max_sessions: 100          # Max concurrent client sessions per server
  max_subscriptions: 100     # Max subscriptions across all sessions
  max_worker_threads: 4      # Worker thread pool size
  max_buffer_size: 1048576   # Transport buffer size in bytes (1MB, needed for many nodes)
  max_nodes_per_read: 1000   # Max nodes that can be read in a single request

machines:
  # ===========================================
  # LINE 1 MACHINES
  # Flow: injection_molding -> robot_pick_place -> cnc_milling -> robot_pick_place -> packaging
  # ===========================================

  # Injection Molding Machine (Line 1 - First Machine)
  - id: INJ-MOLD-01
    name: "Injection Molder 1"
    type: injection_molding
    opcua_port: 4840
    cycle_time_ms: 8000
    scrap_rate: 0.03
    breakdown_probability: 0.0003
    maintenance_interval_h: 400
    auto_restore_time_ms: 45000
    max_stopped_time_ms: 120000  # v1.6.0: Auto-restart after 2 min if stopped with work

  # Robot Pick and Place 1 (Line 1)
  - id: ROBOT-PP-L1-01
    name: "Pick & Place Robot L1-1"
    type: robot_pick_place
    opcua_port: 4841
    cycle_time_ms: 3000
    scrap_rate: 0.005
    breakdown_probability: 0.0001
    maintenance_interval_h: 1000
    auto_restore_time_ms: 30000

  # CNC Milling Machine (Line 1)
  - id: CNC-MILL-01
    name: "CNC Mill 1"
    type: cnc_milling
    opcua_port: 4842
    cycle_time_ms: 12000
    scrap_rate: 0.01
    breakdown_probability: 0.0002
    maintenance_interval_h: 600
    auto_restore_time_ms: 60000

  # Robot Pick and Place 2 (Line 1)
  - id: ROBOT-PP-L1-02
    name: "Pick & Place Robot L1-2"
    type: robot_pick_place
    opcua_port: 4843
    cycle_time_ms: 3000
    scrap_rate: 0.005
    breakdown_probability: 0.0001
    maintenance_interval_h: 1000
    auto_restore_time_ms: 30000

  # Packaging Machine (Line 1 - Last Machine)
  - id: PACK-L1-01
    name: "Packaging Line 1"
    type: packaging
    opcua_port: 4844
    cycle_time_ms: 2000
    scrap_rate: 0.01
    breakdown_probability: 0.0002
    maintenance_interval_h: 800
    auto_restore_time_ms: 20000

  # ===========================================
  # LINE 2 MACHINES
  # Flow: metal_forming -> spot_welder -> packaging
  # ===========================================

  # Metal Forming / Press Machine (Line 2 - First Machine)
  - id: METAL-FORM-01
    name: "Metal Press 1"
    type: metal_forming
    opcua_port: 4845
    cycle_time_ms: 5000
    scrap_rate: 0.02
    breakdown_probability: 0.0005
    maintenance_interval_h: 500
    auto_restore_time_ms: 50000

  # Spot Welder (Line 2)
  - id: SPOT-WELD-01
    name: "Spot Welder 1"
    type: spot_welder
    opcua_port: 4846
    cycle_time_ms: 4000
    scrap_rate: 0.015
    breakdown_probability: 0.0004
    maintenance_interval_h: 300
    auto_restore_time_ms: 40000

  # Packaging Machine (Line 2 - Last Machine)
  - id: PACK-L2-01
    name: "Packaging Line 2"
    type: packaging
    opcua_port: 4847
    cycle_time_ms: 2000
    scrap_rate: 0.01
    breakdown_probability: 0.0002
    maintenance_interval_h: 800
    auto_restore_time_ms: 20000

  # ===========================================
  # STANDALONE MACHINES
  # ===========================================

  # Robot Welder (Standalone - not in any line)
  - id: ROBOT-WELD-01
    name: "Robot Welder 1"
    type: robot_welder
    opcua_port: 4848
    cycle_time_ms: 15000
    scrap_rate: 0.02
    breakdown_probability: 0.0003
    maintenance_interval_h: 400
    auto_restore_time_ms: 60000

# Production line configuration
lines:
  # Line 1: 5 machines with 4 buffers between them
  - name: "Line1"
    enabled: true
    machines:
      - INJ-MOLD-01
      - ROBOT-PP-L1-01
      - CNC-MILL-01
      - ROBOT-PP-L1-02
      - PACK-L1-01
    buffer_size: 10
    buffer_overrides:
      - from: INJ-MOLD-01
        to: ROBOT-PP-L1-01
        capacity: 15
      - from: ROBOT-PP-L1-01
        to: CNC-MILL-01
        capacity: 10
      - from: CNC-MILL-01
        to: ROBOT-PP-L1-02
        capacity: 10
      - from: ROBOT-PP-L1-02
        to: PACK-L1-01
        capacity: 10
    products:
      - MOLDED-PART-001
      - MOLDED-PART-002

  # Line 2: 3 machines with 2 buffers between them
  - name: "Line2"
    enabled: true
    machines:
      - METAL-FORM-01
      - SPOT-WELD-01
      - PACK-L2-01
    buffer_size: 10
    buffer_overrides:
      - from: METAL-FORM-01
        to: SPOT-WELD-01
        capacity: 10
      - from: SPOT-WELD-01
        to: PACK-L2-01
        capacity: 10
    products:
      - METAL-ASSEMBLY-001
      - METAL-ASSEMBLY-002
