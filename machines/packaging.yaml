name: packaging
display_name: "Packaging Machine"

dataModel:
  name: packaging
  version:
    v1:
      structure:
        State:
          _payloadshape: timeseries-string
        CycleCount:
          _payloadshape: timeseries-number
        ConveyorSpeed:
          _payloadshape: timeseries-number
        BoxesPerMinute:
          _payloadshape: timeseries-number
        BoxCount:
          _payloadshape: timeseries-number
        PalletsCompleted:
          _payloadshape: timeseries-number
        SealerTemp:
          _payloadshape: timeseries-number
        SealerPressure:
          _payloadshape: timeseries-number
        LabelsPrinted:
          _payloadshape: timeseries-number
        LabelRollRemaining:
          _payloadshape: timeseries-number
        Weight:
          _payloadshape: timeseries-number
        ErrorCode:
          _payloadshape: timeseries-number

dataContract:
  name: _packaging_v1
  model:
    name: packaging
    version: v1

# Protocol converter template - exact UMH config format
# {{ .IP }}, {{ .PORT }}, {{ .location_path }} are UMH runtime template variables
protocolConverter:
  connection:
    nmap:
      target: '{{ .IP }}'
      port: '{{ .PORT }}'
  dataflowcomponent_read:
    benthos:
      input:
        opcua:
          endpoint: opc.tcp://{{ .IP }}:{{ .PORT }}
          nodeIDs:
            - "ns=1;i=3"
            - "ns=1;i=4"
            - "ns=1;i=5"
            - "ns=1;i=7"
            - "ns=1;i=8"
            - "ns=1;i=10"
            - "ns=1;i=11"
            - "ns=1;i=12"
            - "ns=1;i=14"
            - "ns=1;i=15"
            - "ns=1;i=17"
            - "ns=1;i=22"
          pollRate: 1000
          subscribeEnabled: false
      pipeline:
        processors:
          - tag_processor:
              conditions:
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=3"'
                  then: |
                    msg.meta.tag_name = "State";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=4"'
                  then: |
                    msg.meta.tag_name = "CycleCount";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=5"'
                  then: |
                    msg.meta.tag_name = "ConveyorSpeed";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=7"'
                  then: |
                    msg.meta.tag_name = "BoxesPerMinute";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=8"'
                  then: |
                    msg.meta.tag_name = "BoxCount";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=10"'
                  then: |
                    msg.meta.tag_name = "PalletsCompleted";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=11"'
                  then: |
                    msg.meta.tag_name = "SealerTemp";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=12"'
                  then: |
                    msg.meta.tag_name = "SealerPressure";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=14"'
                  then: |
                    msg.meta.tag_name = "LabelsPrinted";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=15"'
                  then: |
                    msg.meta.tag_name = "LabelRollRemaining";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=17"'
                  then: |
                    msg.meta.tag_name = "Weight";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=22"'
                  then: |
                    msg.meta.tag_name = "ErrorCode";
                    return msg;
              defaults: |
                msg.meta.location_path = "{{ .location_path }}";
                msg.meta.data_contract = "_packaging_v1";
                msg.meta.virtual_path = msg.meta.tag_name;
                msg.meta.historian = "true";
                msg.meta.timestamp_ms = msg.meta.opcua_server_timestamp;
                return msg;
      buffer:
        none: {}
