# Protocol converter template - exact UMH config format
# {{ .IP }}, {{ .PORT }}, {{ .location_path }} are UMH runtime template variables
protocolConverter:
  connection:
    nmap:
      target: "{{ .IP }}"
      port: "{{ .PORT }}"
  dataflowcomponent_read:
    benthos:
      input:
        opcua:
          endpoint: opc.tcp://{{ .IP }}:{{ .PORT }}
          nodeIDs:
            - "ns=1;i=1"
            - "ns=1;i=2"
            - "ns=1;i=3"
            - "ns=1;i=4"
            - "ns=1;i=5"
            - "ns=1;i=6"
            - "ns=1;i=7"
            - "ns=1;i=8"
            - "ns=1;i=9"
            - "ns=1;i=10"
            - "ns=1;i=11"
            - "ns=1;i=12"
            - "ns=1;i=13"
            - "ns=1;i=14"
            - "ns=1;i=15"
            - "ns=1;i=16"
            - "ns=1;i=17"
            - "ns=1;i=18"
            - "ns=1;i=19"
            - "ns=1;i=20"
            - "ns=1;i=21"
          pollRate: 1000
          subscribeEnabled: false
      pipeline:
        processors:
          - tag_processor:
              defaults: |-
                msg.meta.location_path = "{{ .location_path }}";
                msg.meta.data_contract = "_aoi_inspection_v1";
                msg.meta.virtual_path = "";
                msg.meta.historian = "true";
                msg.meta.timestamp_ms = msg.meta.opcua_server_timestamp;

                // Auto-generated from addressMappings
                switch(msg.meta.opcua_attr_nodeid) {
                {{- range .AddressMappings }}
                  case "{{ .Address }}":
                    msg.meta.tag_name = "{{ .TagName }}";
                    msg.meta.unit = "{{ .Unit }}";
                    {{- if .VirtualPath }}msg.meta.virtual_path = "{{ .VirtualPath }}";{{- end }}
                    {{- if .LocationPathSuffix }}msg.meta.location_path += ".{{ .LocationPathSuffix }}";{{- end }}
                    {{- if .DataContract }}msg.meta.data_contract = "{{ .DataContract }}";{{- end }}

                    break;
                {{- end }}
                  default:
                    msg.meta.tag_name = msg.meta.opcua_tag_name;
                    msg.meta.unit = "raw";
                    break;
                }

                return msg;
              conditions:
                - if: msg.meta.tag_name === "blocked_by_buffer"
                  then: |-
                    msg.payload = Number(msg.payload);
                    return msg;
      buffer:
        none: {}
