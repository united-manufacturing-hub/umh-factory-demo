name: spot-welder
display_name: "Spot Welder"

dataModel:
  name: spot_welder
  version:
    v1:
      structure:
        State:
          _payloadshape: timeseries-string
        CycleCount:
          _payloadshape: timeseries-number
        WeldCurrent:
          _payloadshape: timeseries-number
        WeldVoltage:
          _payloadshape: timeseries-number
        WeldTime:
          _payloadshape: timeseries-number
        ElectrodeForce:
          _payloadshape: timeseries-number
        ElectrodeWear:
          _payloadshape: timeseries-number
        NuggetDiameter:
          _payloadshape: timeseries-number
        WeldQuality:
          _payloadshape: timeseries-number
        CoolingTemp:
          _payloadshape: timeseries-number
        CoolingFlow:
          _payloadshape: timeseries-number
        SpotNumber:
          _payloadshape: timeseries-number
        SpotsPerPart:
          _payloadshape: timeseries-number
        ErrorCode:
          _payloadshape: timeseries-number

dataContract:
  name: _spot_welder_v1
  model:
    name: spot_welder
    version: v1

# Protocol converter template - exact UMH config format
# {{ .IP }}, {{ .PORT }}, {{ .location_path }} are UMH runtime template variables
protocolConverter:
  connection:
    nmap:
      target: '{{ .IP }}'
      port: '{{ .PORT }}'
  dataflowcomponent_read:
    benthos:
      input:
        opcua:
          endpoint: opc.tcp://{{ .IP }}:{{ .PORT }}
          nodeIDs:
            - "ns=1;i=3"
            - "ns=1;i=4"
            - "ns=1;i=5"
            - "ns=1;i=6"
            - "ns=1;i=7"
            - "ns=1;i=8"
            - "ns=1;i=9"
            - "ns=1;i=10"
            - "ns=1;i=11"
            - "ns=1;i=13"
            - "ns=1;i=14"
            - "ns=1;i=15"
            - "ns=1;i=16"
            - "ns=1;i=19"
          pollRate: 1000
          subscribeEnabled: false
      pipeline:
        processors:
          - tag_processor:
              conditions:
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=3"'
                  then: |
                    msg.meta.tag_name = "State";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=4"'
                  then: |
                    msg.meta.tag_name = "CycleCount";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=5"'
                  then: |
                    msg.meta.tag_name = "WeldCurrent";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=6"'
                  then: |
                    msg.meta.tag_name = "WeldVoltage";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=7"'
                  then: |
                    msg.meta.tag_name = "WeldTime";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=8"'
                  then: |
                    msg.meta.tag_name = "ElectrodeForce";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=9"'
                  then: |
                    msg.meta.tag_name = "ElectrodeWear";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=10"'
                  then: |
                    msg.meta.tag_name = "NuggetDiameter";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=11"'
                  then: |
                    msg.meta.tag_name = "WeldQuality";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=13"'
                  then: |
                    msg.meta.tag_name = "CoolingTemp";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=14"'
                  then: |
                    msg.meta.tag_name = "CoolingFlow";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=15"'
                  then: |
                    msg.meta.tag_name = "SpotNumber";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=16"'
                  then: |
                    msg.meta.tag_name = "SpotsPerPart";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=19"'
                  then: |
                    msg.meta.tag_name = "ErrorCode";
                    return msg;
              defaults: |
                msg.meta.location_path = "{{ .location_path }}";
                msg.meta.data_contract = "_spot_welder_v1";
                msg.meta.virtual_path = msg.meta.tag_name;
                msg.meta.historian = "true";
                msg.meta.timestamp_ms = msg.meta.opcua_server_timestamp;
                return msg;
      buffer:
        none: {}
