name: robot-pick-place
display_name: "Robot Pick & Place"

dataModel:
  name: robot_pick_place
  version:
    v1:
      structure:
        State:
          _payloadshape: timeseries-string
        CycleCount:
          _payloadshape: timeseries-number
        CycleTime:
          _payloadshape: timeseries-number
        CycleProgress:
          _payloadshape: timeseries-number
        GoodParts:
          _payloadshape: timeseries-number
        ScrapParts:
          _payloadshape: timeseries-number
        PositionX:
          _payloadshape: timeseries-number
        PositionY:
          _payloadshape: timeseries-number
        PositionZ:
          _payloadshape: timeseries-number
        Joint1:
          _payloadshape: timeseries-number
        Joint2:
          _payloadshape: timeseries-number
        Joint3:
          _payloadshape: timeseries-number
        Joint4:
          _payloadshape: timeseries-number
        Joint5:
          _payloadshape: timeseries-number
        Joint6:
          _payloadshape: timeseries-number
        GripperState:
          _payloadshape: timeseries-number
        GripForce:
          _payloadshape: timeseries-number
        Speed:
          _payloadshape: timeseries-number
        CurrentOrderId:
          _payloadshape: timeseries-string
        PartInGripper:
          _payloadshape: timeseries-string
        ErrorCode:
          _payloadshape: timeseries-number
        ErrorMessage:
          _payloadshape: timeseries-string

dataContract:
  name: _robot_pick_place_v1
  model:
    name: robot_pick_place
    version: v1

# Protocol converter template - exact UMH config format
# {{ .IP }}, {{ .PORT }}, {{ .location_path }} are UMH runtime template variables
protocolConverter:
  connection:
    nmap:
      target: '{{ .IP }}'
      port: '{{ .PORT }}'
  dataflowcomponent_read:
    benthos:
      input:
        opcua:
          endpoint: opc.tcp://{{ .IP }}:{{ .PORT }}
          nodeIDs:
            - "ns=1;i=3"
            - "ns=1;i=4"
            - "ns=1;i=5"
            - "ns=1;i=6"
            - "ns=1;i=7"
            - "ns=1;i=8"
            - "ns=1;i=9"
            - "ns=1;i=10"
            - "ns=1;i=11"
            - "ns=1;i=12"
            - "ns=1;i=13"
            - "ns=1;i=14"
            - "ns=1;i=15"
            - "ns=1;i=17"
            - "ns=1;i=20"
          pollRate: 1000
          subscribeEnabled: false
      pipeline:
        processors:
          - tag_processor:
              conditions:
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=3"'
                  then: |
                    msg.meta.tag_name = "State";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=4"'
                  then: |
                    msg.meta.tag_name = "CycleCount";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=5"'
                  then: |
                    msg.meta.tag_name = "Joint1";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=6"'
                  then: |
                    msg.meta.tag_name = "Joint2";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=7"'
                  then: |
                    msg.meta.tag_name = "Joint3";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=8"'
                  then: |
                    msg.meta.tag_name = "Joint4";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=9"'
                  then: |
                    msg.meta.tag_name = "Joint5";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=10"'
                  then: |
                    msg.meta.tag_name = "Joint6";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=11"'
                  then: |
                    msg.meta.tag_name = "PositionX";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=12"'
                  then: |
                    msg.meta.tag_name = "PositionY";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=13"'
                  then: |
                    msg.meta.tag_name = "PositionZ";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=14"'
                  then: |
                    msg.meta.tag_name = "GripperState";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=15"'
                  then: |
                    msg.meta.tag_name = "GripForce";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=17"'
                  then: |
                    msg.meta.tag_name = "Speed";
                    return msg;
                - if: 'msg.meta.opcua_attr_nodeid == "ns=1;i=20"'
                  then: |
                    msg.meta.tag_name = "ErrorCode";
                    return msg;
              defaults: |
                msg.meta.location_path = "{{ .location_path }}";
                msg.meta.data_contract = "_robot_pick_place_v1";
                msg.meta.virtual_path = msg.meta.tag_name;
                msg.meta.historian = "true";
                msg.meta.timestamp_ms = msg.meta.opcua_server_timestamp;
                return msg;
      buffer:
        none: {}
