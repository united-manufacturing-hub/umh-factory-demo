name: Release

on:
  push:
    branches: [dev, staging]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine branch type
        id: branch
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "name=${BRANCH}" >> "$GITHUB_OUTPUT"
          if [ "$BRANCH" = "staging" ]; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Branch: $BRANCH"

      - name: Get latest tag
        id: latest_tag
        run: |
          IS_STABLE="${{ steps.branch.outputs.is_stable }}"

          if [ "$IS_STABLE" = "true" ]; then
            # For staging: latest stable tag (no prerelease suffix)
            TAG=$(git tag -l 'v*' --sort=-v:refname | grep -vE '\-dev\.' | head -1)
          else
            # For dev: latest dev tag, fall back to latest stable tag
            TAG=$(git tag -l 'v*-dev.*' --sort=-v:refname | head -1)
            if [ -z "$TAG" ]; then
              TAG=$(git tag -l 'v*' --sort=-v:refname | grep -vE '\-dev\.' | head -1)
            fi
          fi

          echo "tag=${TAG:-v0.0.0}" >> "$GITHUB_OUTPUT"
          echo "Latest tag: ${TAG:-v0.0.0}"

      - name: Determine version bump from commits
        id: bump
        run: |
          LATEST_TAG="${{ steps.latest_tag.outputs.tag }}"
          IS_STABLE="${{ steps.branch.outputs.is_stable }}"

          # Get commits since last tag
          if git rev-parse "$LATEST_TAG" >/dev/null 2>&1; then
            COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s")
          else
            COMMITS=$(git log --pretty=format:"%s")
          fi

          # Exit if no new commits
          if [ -z "$COMMITS" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Determine bump type from conventional commits
          BUMP="patch"
          if echo "$COMMITS" | grep -qiE "^feat(\(.+\))?!:|BREAKING CHANGE"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qiE "^feat(\(.+\))?:"; then
            BUMP="minor"
          fi

          # Get the base version (strip any -dev.N suffix)
          BASE="${LATEST_TAG#v}"
          BASE="${BASE%%-dev.*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"

          # Only bump if latest tag was stable (not dev), or if this is a stable release
          # For dev: if latest was a dev tag, reuse its base version and just increment dev number
          LATEST_IS_DEV=false
          if echo "$LATEST_TAG" | grep -qE '\-dev\.'; then
            LATEST_IS_DEV=true
          fi

          if [ "$LATEST_IS_DEV" = "false" ]; then
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
          fi

          BASE_VERSION="${MAJOR}.${MINOR}.${PATCH}"

          if [ "$IS_STABLE" = "true" ]; then
            NEW_VERSION="${BASE_VERSION}"
          else
            # Find the next dev number for this base version
            EXISTING_DEV=$(git tag -l "v${BASE_VERSION}-dev.*" --sort=-v:refname | head -1)
            if [ -n "$EXISTING_DEV" ]; then
              DEV_NUM=$(echo "$EXISTING_DEV" | grep -oE 'dev\.[0-9]+' | grep -oE '[0-9]+')
              DEV_NUM=$((DEV_NUM + 1))
            else
              DEV_NUM=1
            fi
            NEW_VERSION="${BASE_VERSION}-dev.${DEV_NUM}"
          fi

          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "bump=${BUMP}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Bump: $BUMP -> v${NEW_VERSION}"

      - name: Generate changelog
        if: steps.bump.outputs.skip != 'true'
        id: changelog
        run: |
          LATEST_TAG="${{ steps.latest_tag.outputs.tag }}"
          NEW_VERSION="v${{ steps.bump.outputs.version }}"

          if git rev-parse "$LATEST_TAG" >/dev/null 2>&1; then
            RANGE="${LATEST_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi

          # Build categorized changelog
          BREAKING=""
          FEATURES=""
          FIXES=""
          OTHER=""

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            if echo "$line" | grep -qiE "^feat(\(.+\))?!:|BREAKING CHANGE"; then
              MSG=$(echo "$line" | sed -E 's/^[a-z]+(\(.+\))?!?: //')
              BREAKING="${BREAKING}- ${MSG}\n"
            elif echo "$line" | grep -qiE "^feat(\(.+\))?:"; then
              MSG=$(echo "$line" | sed -E 's/^feat(\(.+\))?: //')
              FEATURES="${FEATURES}- ${MSG}\n"
            elif echo "$line" | grep -qiE "^fix(\(.+\))?:"; then
              MSG=$(echo "$line" | sed -E 's/^fix(\(.+\))?: //')
              FIXES="${FIXES}- ${MSG}\n"
            else
              OTHER="${OTHER}- ${line}\n"
            fi
          done <<< "$(git log "$RANGE" --pretty=format:"%s")"

          # Assemble release notes
          NOTES=""
          if [ -n "$BREAKING" ]; then
            NOTES="${NOTES}### Breaking Changes\n${BREAKING}\n"
          fi
          if [ -n "$FEATURES" ]; then
            NOTES="${NOTES}### Features\n${FEATURES}\n"
          fi
          if [ -n "$FIXES" ]; then
            NOTES="${NOTES}### Fixes\n${FIXES}\n"
          fi
          if [ -n "$OTHER" ]; then
            NOTES="${NOTES}### Other\n${OTHER}\n"
          fi

          NOTES="${NOTES}**Full Changelog**: [\`${LATEST_TAG}...${NEW_VERSION}\`](https://github.com/${{ github.repository }}/compare/${LATEST_TAG}...${NEW_VERSION})"

          echo -e "$NOTES" > /tmp/release-notes.md

          {
            echo "## ${NEW_VERSION} ($(date +%Y-%m-%d))"
            echo ""
            echo -e "$NOTES"
            echo ""
          } > /tmp/changelog-entry.md

      - name: Update README (staging only)
        if: steps.bump.outputs.skip != 'true' && steps.branch.outputs.is_stable == 'true'
        run: |
          NEW_VERSION="v${{ steps.bump.outputs.version }}"
          REPO="${{ github.repository }}"

          # Update curl URLs
          STABLE_URL="https://github.com/${REPO}/releases/latest/download/quick-start.sh"
          sed -i "s|curl -fsSL https://github.com/${REPO}/releases/[^ ]* -o quick-start.sh|curl -fsSL ${STABLE_URL} -o quick-start.sh|" README.md

          # Update changelog
          if grep -q "^## Changelog" README.md; then
            ENTRY=$(cat /tmp/changelog-entry.md)
            awk -v entry="$ENTRY" '
              /^## Changelog/ { print; print ""; print entry; next }
              { print }
            ' README.md > README.tmp && mv README.tmp README.md
          else
            {
              echo ""
              echo "## Changelog"
              echo ""
              cat /tmp/changelog-entry.md
            } >> README.md
          fi

      - name: Commit and push changes (staging only)
        if: steps.bump.outputs.skip != 'true' && steps.branch.outputs.is_stable == 'true'
        run: |
          NEW_VERSION="v${{ steps.bump.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "release: ${NEW_VERSION}" || true
          git push

      - name: Create tag and release
        if: steps.bump.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION="v${{ steps.bump.outputs.version }}"
          IS_STABLE="${{ steps.branch.outputs.is_stable }}"

          git tag "$NEW_VERSION"
          git push origin "$NEW_VERSION"

          PRERELEASE_FLAG=""
          LATEST_FLAG=""
          if [ "$IS_STABLE" = "true" ]; then
            LATEST_FLAG="--latest"
          else
            PRERELEASE_FLAG="--prerelease"
            LATEST_FLAG="--latest=false"
          fi

          gh release create "$NEW_VERSION" \
            --title "$NEW_VERSION" \
            --notes-file /tmp/release-notes.md \
            --generate-notes=false \
            $PRERELEASE_FLAG \
            $LATEST_FLAG \
            quick-start.sh
