name: PR Test Command

on:
  pull_request:
    types: [opened, synchronize]
    branches: [staging]

permissions:
  pull-requests: write

jobs:
  post-test-command:
    runs-on: ubuntu-latest
    steps:
      - name: Post or update test command comment
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const repo = context.payload.repository.full_name;
            const marker = '<!-- pr-test-command -->';

            const body = [
              marker,
              '## Test this PR',
              '',
              '```bash',
              `curl -fsSL https://raw.githubusercontent.com/${repo}/staging/install.sh -o install.sh && bash install.sh --branch=${branch}`,
              '```',
              '',
              '_Updated automatically on each push._'
            ].join('\n');

            // Find existing comment by marker
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.data.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
